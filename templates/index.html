<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit Data</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; display: grid; place-items: center; min-height: 100vh; }
    .card { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); width: min(420px, 92vw); }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin: 1rem 0 .3rem; font-weight: 600; font-size: .9rem; }
    input, textarea { width: 100%; padding: .6rem; border: 1px solid #c8ced6; border-radius: 8px; font: inherit; box-sizing: border-box; }
    button { margin-top: 1.2rem; width: 100%; padding: .7rem; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; padding: .7rem; border-radius: 8px; margin-bottom: 1rem; font-size: .9rem; word-break: break-word; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Submit your details</h1>

    {% if error %}
      <div class="error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('submit') }}">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" value="{{ form.get('name', '') }}" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" required>{{ form.get('message', '') }}</textarea>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
